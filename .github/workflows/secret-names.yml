name: Secret Names Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List available secret names
        env:
          SECRET_JSON: ${{ toJSON(secrets) }}
        run: |
          echo "=== SECRET NAMES ==="
          python3 -c 'import os,json; d=json.loads(os.environ.get("SECRET_JSON","{}")); [print(k) for k in sorted(d.keys())]'
          echo "=== END SECRET NAMES ==="
